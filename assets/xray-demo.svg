<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-label="StyleSniper Live X-Ray, Figma Redline, and Tailwind HUD Demo">
  <defs>
    <style>
      .mono { font-family: ui-monospace, 'SFMono-Regular', 'JetBrains Mono', Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif; }
      .redline-fade { animation: redlineCycle 4s ease-in-out infinite; }
      .toast-pop { animation: toastCycle 4s ease-in-out infinite; }
      @keyframes redlineCycle {
        0%, 15% { opacity: 0.25; }
        35%, 80% { opacity: 1; }
        100% { opacity: 0.25; }
      }
      @keyframes toastCycle {
        0%, 45% { opacity: 0; transform: translateY(8px); }
        55%, 85% { opacity: 1; transform: translateY(0px); }
        100% { opacity: 0; transform: translateY(8px); }
      }
    </style>
  </defs>

  <!-- Browser Window Frame -->
  <rect width="960" height="440" rx="12" fill="#090B0F" stroke="#262C36"/>
  <rect width="960" height="36" rx="12" fill="#141820"/>
  <rect y="24" width="960" height="12" fill="#141820"/>
  <line x1="0" y1="36" x2="960" y2="36" stroke="#262C36"/>

  <!-- Browser Traffic Lights & URL -->
  <circle cx="20" cy="18" r="5" fill="#262C36"/>
  <circle cx="36" cy="18" r="5" fill="#262C36"/>
  <circle cx="52" cy="18" r="5" fill="#262C36"/>
  <rect x="82" y="8" width="260" height="20" rx="4" fill="#090B0F" stroke="#262C36"/>
  <text x="94" y="21" class="mono" font-size="10" fill="#94A3B8">https://app.example.dev/dashboard</text>
  <rect x="844" y="8" width="98" height="20" rx="4" fill="rgba(16,185,129,0.14)" stroke="#10B981"/>
  <text x="893" y="21" text-anchor="middle" class="mono" font-size="10" font-weight="700" fill="#10B981">X-RAY: ON</text>

  <!-- Mock Host Page Card (Left) -->
  <rect x="44" y="74" width="460" height="316" rx="10" fill="#11151C" stroke="#1E2430"/>
  <text x="72" y="114" class="sans" font-size="22" font-weight="700" fill="#F8FAFC">Deployments</text>
  <text x="72" y="138" class="sans" font-size="13" fill="#94A3B8">Production edge network is healthy across 24 regions.</text>

  <!-- Pinned Primary CTA Button with Box Model -->
  <!-- Margin Box (Amber) -->
  <rect x="60" y="168" width="204" height="68" rx="4" fill="rgba(245,158,11,0.14)" stroke="#F59E0B" stroke-dasharray="4,3"/>
  <!-- Padding Box (Emerald) -->
  <rect x="72" y="180" width="180" height="44" rx="8" fill="rgba(16,185,129,0.18)" stroke="#10B981"/>
  <!-- Content Box (Cyan) -->
  <rect x="88" y="190" width="148" height="24" rx="3" fill="rgba(56,189,248,0.18)" stroke="#38BDF8" stroke-width="1.5"/>
  <!-- Pinned Amber Lock Frame -->
  <rect x="72" y="180" width="180" height="44" rx="8" fill="none" stroke="#F59E0B" stroke-width="2"/>
  <text x="162" y="206" text-anchor="middle" class="sans" font-size="13" font-weight="600" fill="#F8FAFC">Deploy Release</text>

  <!-- Secondary Button (Hovered Target for Alt-Redline) -->
  <rect x="300" y="180" width="144" height="44" rx="8" fill="#141820" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="372" y="206" text-anchor="middle" class="sans" font-size="13" font-weight="600" fill="#CBD5E1">View Logs</text>

  <!-- Animated Figma-Style Amber Redline Measurement (48px gap) -->
  <g class="redline-fade mono">
    <line x1="252" y1="202" x2="300" y2="202" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="3,2"/>
    <line x1="252" y1="196" x2="252" y2="208" stroke="#F59E0B" stroke-width="1.5"/>
    <line x1="300" y1="196" x2="300" y2="208" stroke="#F59E0B" stroke-width="1.5"/>
    <rect x="257" y="192" width="38" height="20" rx="3" fill="#090B0F" stroke="#F59E0B"/>
    <text x="276" y="205" text-anchor="middle" font-size="10" font-weight="700" fill="#F59E0B">48px</text>

    <!-- Vertical Redline from Heading to Button (42px) -->
    <line x1="162" y1="142" x2="162" y2="180" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="3,2"/>
    <line x1="156" y1="142" x2="168" y2="142" stroke="#F59E0B" stroke-width="1.5"/>
    <line x1="156" y1="180" x2="168" y2="180" stroke="#F59E0B" stroke-width="1.5"/>
    <rect x="143" y="151" width="38" height="20" rx="3" fill="#090B0F" stroke="#F59E0B"/>
    <text x="162" y="164" text-anchor="middle" font-size="10" font-weight="700" fill="#F59E0B">38px</text>
  </g>

  <!-- Box Model Legend -->
  <g class="mono" font-size="10">
    <rect x="72" y="276" width="10" height="10" rx="2" fill="rgba(56,189,248,0.35)" stroke="#38BDF8"/>
    <text x="88" y="285" fill="#94A3B8">Content (148×24)</text>
    <rect x="206" y="276" width="10" height="10" rx="2" fill="rgba(16,185,129,0.35)" stroke="#10B981"/>
    <text x="222" y="285" fill="#94A3B8">Padding (10px 16px)</text>
    <rect x="356" y="276" width="10" height="10" rx="2" fill="rgba(245,158,11,0.35)" stroke="#F59E0B"/>
    <text x="372" y="285" fill="#94A3B8">Margin (12px)</text>
  </g>

  <!-- Shadow DOM Isolated Precision HUD (Right) -->
  <g>
    <rect x="540" y="64" width="380" height="328" rx="8" fill="#090B0F" stroke="#F59E0B" stroke-width="1.5"/>
    <!-- HUD Header -->
    <rect x="541" y="65" width="378" height="36" rx="7" fill="#141820"/>
    <line x1="540" y1="101" x2="920" y2="101" stroke="#262C36"/>
    <text x="554" y="87" class="mono" font-size="12" font-weight="700" fill="#38BDF8">button.btn-primary</text>
    <text x="702" y="87" class="mono" font-size="11" fill="#94A3B8">180 × 44px</text>
    <rect x="852" y="74" width="54" height="18" rx="3" fill="rgba(245,158,11,0.16)" stroke="#F59E0B"/>
    <text x="879" y="86" text-anchor="middle" class="mono" font-size="9" font-weight="700" fill="#F59E0B">PINNED</text>

    <!-- Meta + WCAG -->
    <text x="554" y="122" class="mono" font-size="11" fill="#E2E8F0">Inter · 13px · 600</text>
    <text x="554" y="138" class="mono" font-size="10" fill="#64748B">line-height: 20px · display: inline-flex</text>

    <rect x="554" y="148" width="96" height="20" rx="4" fill="#141820" stroke="#262C36"/>
    <rect x="560" y="153" width="10" height="10" rx="2" fill="#F8FAFC"/>
    <text x="576" y="162" class="mono" font-size="10" fill="#CBD5E1">FG #F8FAFC</text>

    <rect x="658" y="148" width="96" height="20" rx="4" fill="#141820" stroke="#262C36"/>
    <rect x="664" y="153" width="10" height="10" rx="2" fill="#090B0F" stroke="#475569"/>
    <text x="680" y="162" class="mono" font-size="10" fill="#CBD5E1">BG #090B0F</text>

    <rect x="826" y="114" width="80" height="48" rx="5" fill="rgba(16,185,129,0.12)" stroke="#10B981"/>
    <text x="866" y="135" text-anchor="middle" class="mono" font-size="13" font-weight="700" fill="#F8FAFC">18.4:1</text>
    <text x="866" y="152" text-anchor="middle" class="mono" font-size="9" font-weight="700" fill="#10B981">WCAG AAA</text>

    <line x1="540" y1="180" x2="920" y2="180" stroke="#262C36"/>

    <!-- Tabs -->
    <text x="556" y="201" class="mono" font-size="11" font-weight="700" fill="#38BDF8">Tailwind</text>
    <line x1="554" y1="208" x2="612" y2="208" stroke="#38BDF8" stroke-width="2"/>
    <text x="630" y="201" class="mono" font-size="11" fill="#64748B">CSS</text>
    <text x="670" y="201" class="mono" font-size="11" fill="#64748B">JSX</text>
    <rect x="806" y="186" width="102" height="20" rx="4" fill="#141820" stroke="#10B981"/>
    <text x="857" y="199" text-anchor="middle" class="mono" font-size="10" font-weight="700" fill="#10B981">Copy (C)</text>

    <!-- Code Box -->
    <rect x="541" y="210" width="378" height="114" fill="#06080B"/>
    <text x="554" y="232" class="mono" font-size="11" fill="#38BDF8">inline-flex items-center justify-center</text>
    <text x="554" y="250" class="mono" font-size="11" fill="#E2E8F0">px-4 py-2.5 text-[13px] font-semibold</text>
    <text x="554" y="268" class="mono" font-size="11" fill="#E2E8F0">text-slate-50 bg-[#090b0f] rounded-lg</text>
    <text x="554" y="286" class="mono" font-size="11" fill="#E2E8F0">border border-[#262c36] cursor-pointer</text>
    <text x="554" y="304" class="mono" font-size="11" fill="#10B981">/* 11 utility classes compiled */</text>

    <line x1="540" y1="324" x2="920" y2="324" stroke="#262C36"/>

    <!-- Action Bar -->
    <rect x="552" y="334" width="70" height="24" rx="4" fill="#141820" stroke="#262C36"/>
    <text x="587" y="349" text-anchor="middle" class="mono" font-size="10" fill="#CBD5E1">↑ Parent</text>
    <rect x="628" y="334" width="66" height="24" rx="4" fill="#141820" stroke="#262C36"/>
    <text x="661" y="349" text-anchor="middle" class="mono" font-size="10" fill="#CBD5E1">↓ Child</text>
    <rect x="700" y="334" width="62" height="24" rx="4" fill="#141820" stroke="#262C36"/>
    <text x="731" y="349" text-anchor="middle" class="mono" font-size="10" fill="#CBD5E1">✎ Edit</text>
    <rect x="812" y="334" width="96" height="24" rx="4" fill="#141820" stroke="#38BDF8" stroke-opacity="0.6"/>
    <text x="860" y="349" text-anchor="middle" class="mono" font-size="10" fill="#38BDF8">Design System</text>

    <!-- Footer Hint -->
    <text x="554" y="381" class="mono" font-size="10" fill="#64748B">Click/Space Pin · Alt Redline · E Edit · Esc Exit</text>
  </g>

  <!-- Animated Copy Toast -->
  <g class="toast-pop mono">
    <rect x="380" y="396" width="200" height="28" rx="6" fill="#090B0F" stroke="#10B981"/>
    <text x="480" y="414" text-anchor="middle" font-size="11" font-weight="700" fill="#10B981">✓ Copied TAILWIND snippet</text>
  </g>
</svg>
