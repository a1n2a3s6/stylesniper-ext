<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="960" height="320" role="img" aria-label="StyleSniper — Zero-Build Chrome and Edge X-Ray Inspector">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#161B24" stroke-width="1"/>
    </pattern>
    <linearGradient id="scanline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <style>
      .mono { font-family: ui-monospace, 'SFMono-Regular', 'JetBrains Mono', Menlo, Consolas, monospace; }
      .scan { animation: scanMove 4.2s ease-in-out infinite; }
      .pulse { animation: pulseDot 1.8s ease-in-out infinite; }
      .reticle { transform-origin: 760px 160px; animation: slowSpin 14s linear infinite; }
      @keyframes scanMove {
        0%, 100% { transform: translateY(0px); opacity: 0.25; }
        50% { transform: translateY(270px); opacity: 0.85; }
      }
      @keyframes pulseDot {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }
      @keyframes slowSpin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
    </style>
  </defs>

  <!-- Matte Obsidian Canvas -->
  <rect width="960" height="320" rx="12" fill="#090B0F"/>
  <rect width="960" height="320" rx="12" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="959" height="319" rx="11.5" fill="none" stroke="#262C36"/>

  <!-- Animated Horizontal Telemetry Scanline -->
  <rect class="scan" x="16" y="20" width="928" height="2" fill="url(#scanline)"/>

  <!-- Top Telemetry Bar -->
  <g class="mono" font-size="11">
    <rect x="40" y="34" width="152" height="24" rx="4" fill="#141820" stroke="#262C36"/>
    <circle class="pulse" cx="55" cy="46" r="3.5" fill="#10B981"/>
    <text x="66" y="50" fill="#10B981" font-weight="700">MANIFEST V3 · READY</text>

    <rect x="204" y="34" width="142" height="24" rx="4" fill="#141820" stroke="#262C36"/>
    <text x="216" y="50" fill="#94A3B8">ZERO-BUILD · SHADOW DOM</text>

    <rect x="358" y="34" width="106" height="24" rx="4" fill="#141820" stroke="#262C36"/>
    <text x="370" y="50" fill="#F59E0B" font-weight="700">ALT+SHIFT+X</text>
  </g>

  <!-- Main Title & Tagline -->
  <text x="40" y="132" class="mono" font-size="52" font-weight="800" fill="#F8FAFC" letter-spacing="-1.5">StyleSniper</text>
  <text x="40" y="168" class="mono" font-size="16" fill="#94A3B8">Open-source X-Ray inspector, CSS-to-Tailwind compiler,</text>
  <text x="40" y="192" class="mono" font-size="16" fill="#94A3B8">Figma-style redlines, WCAG 2.1 checker &amp; SVG gobbler.</text>

  <!-- Feature Chips -->
  <g class="mono" font-size="12" font-weight="600">
    <rect x="40" y="228" width="148" height="32" rx="6" fill="#141820" stroke="#38BDF8" stroke-opacity="0.5"/>
    <text x="56" y="248" fill="#38BDF8">◎ 60fps Box Model</text>

    <rect x="200" y="228" width="154" height="32" rx="6" fill="#141820" stroke="#F59E0B" stroke-opacity="0.5"/>
    <text x="216" y="248" fill="#F59E0B">⌖ Alt Redlines</text>

    <rect x="366" y="228" width="146" height="32" rx="6" fill="#141820" stroke="#10B981" stroke-opacity="0.5"/>
    <text x="382" y="248" fill="#10B981">✓ WCAG 2.1 AAA</text>
  </g>

  <!-- Right Side Precision Reticle Graphic -->
  <g>
    <rect x="640" y="48" width="240" height="224" rx="10" fill="#141820" stroke="#262C36"/>
    <!-- Simulated Element Box Model -->
    <rect x="676" y="92" width="168" height="136" rx="4" fill="rgba(245,158,11,0.12)" stroke="#F59E0B" stroke-dasharray="4,3"/>
    <rect x="694" y="110" width="132" height="100" rx="4" fill="rgba(16,185,129,0.14)" stroke="#10B981"/>
    <rect x="712" y="128" width="96" height="64" rx="3" fill="rgba(56,189,248,0.16)" stroke="#38BDF8" stroke-width="1.5"/>

    <!-- Rotating Outer Reticle -->
    <g class="reticle">
      <circle cx="760" cy="160" r="44" fill="none" stroke="#38BDF8" stroke-width="1.2" stroke-dasharray="10,8"/>
    </g>
    <!-- Static Crosshairs -->
    <line x1="760" y1="98" x2="760" y2="132" stroke="#F59E0B" stroke-width="2"/>
    <line x1="760" y1="188" x2="760" y2="222" stroke="#F59E0B" stroke-width="2"/>
    <line x1="698" y1="160" x2="732" y2="160" stroke="#F59E0B" stroke-width="2"/>
    <line x1="788" y1="160" x2="822" y2="160" stroke="#F59E0B" stroke-width="2"/>
    <circle cx="760" cy="160" r="4" fill="#10B981"/>

    <!-- Dimension Badge -->
    <rect x="698" y="64" width="124" height="20" rx="4" fill="#090B0F" stroke="#262C36"/>
    <text x="760" y="78" text-anchor="middle" class="mono" font-size="10" font-weight="700" fill="#38BDF8">button.cta · 168×44</text>
  </g>
</svg>
